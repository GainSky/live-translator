name: release

# 正式版发布：推送 v* tag 触发，三平台打包并创建 GitHub Release（草稿，手动发布）
on:
  push:
    tags: ["v*"]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Tauri + ALSA audio + AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev patchelf libfuse2

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # ALSA 兜底音频（CI runner 的 PipeWire 头文件过老）；完整 PipeWire 版
      # 请在目标 Linux 机上 ./run-release.sh 自建
      - name: Build (Linux x64, AppImage + deb)
        run: pnpm tauri build -- --no-default-features

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-windows:
    # sherpa-onnx 静态编译在 windows-latest 上验证通过（windows-2022 会链接失败）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build (Windows x64, NSIS 中文安装器, CPU 版)
        run: pnpm tauri build -- --no-default-features

      - name: Rename bundle (mark cpu)
        shell: pwsh
        run: |
          $f = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $f.FullName ("src-tauri/target/release/bundle/nsis/" + ($f.Name -replace "_x64-setup", "_x64-cpu-setup"))

      - uses: actions/upload-artifact@v4
        with:
          name: windows-cpu-bundle
          path: src-tauri/target/release/bundle/nsis/*cpu-setup.exe
          if-no-files-found: error

  build-windows-cuda13:
    # 内置翻译引擎 GPU 推理版：需目标机装有 CUDA 13 运行时（驱动 ≥ 580）。
    # CUDA 13.2 支持 VS2026（windows-latest）；其 CCCL 要求标准预处理器，
    # 经 NVCC_APPEND_FLAGS 向宿主编译器传 /Zc:preprocessor
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.2.0"
          method: "local"

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build (Windows x64, NSIS 安装器, CUDA 13 GPU 版)
        run: pnpm tauri build -- --no-default-features --features cuda
        env:
          CUDA_COMPUTE_CAP: "86"
          NVCC_APPEND_FLAGS: "-Xcompiler /Zc:preprocessor -DCCCL_IGNORE_MSVC_TRADITIONAL_PREPROCESSOR_WARNING"

      - name: Rename bundle (mark cuda13)
        shell: pwsh
        run: |
          $f = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $f.FullName ("src-tauri/target/release/bundle/nsis/" + ($f.Name -replace "_x64-setup", "_x64-cuda13-setup"))

      - uses: actions/upload-artifact@v4
        with:
          name: windows-cuda13-bundle
          path: src-tauri/target/release/bundle/nsis/*cuda13-setup.exe
          if-no-files-found: error

  # CUDA 12 版：目标机装有 CUDA 12 运行时的场景（工具链配置取自
  # 早期 build-cuda 提交：windows-2022 + toolkit 12.8.1 + msvc-dev-cmd）
  build-windows-cuda12:
    # 实验性：windows-2022 上 sherpa 静态编译尚待验证（CPU/CUDA13 已移回
    # windows-latest）；失败不阻塞 Release（从 needs 中移除，产物可选附带）
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.1"
          method: "local"

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build (Windows x64, NSIS 安装器, CUDA 12 GPU 版)
        run: pnpm tauri build -- --no-default-features --features cuda
        env:
          CUDA_COMPUTE_CAP: "86"

      - name: Rename bundle (mark cuda12)
        shell: pwsh
        run: |
          $f = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $f.FullName ("src-tauri/target/release/bundle/nsis/" + ($f.Name -replace "_x64-setup", "_x64-cuda12-setup"))

      - uses: actions/upload-artifact@v4
        with:
          name: windows-cuda12-bundle
          path: src-tauri/target/release/bundle/nsis/*cuda12-setup.exe
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows, build-windows-cuda13]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/linux-bundles/*.AppImage
            artifacts/linux-bundles/*.deb
            artifacts/windows-cpu-bundle/*.exe
            artifacts/windows-cuda13-bundle/*.exe
            artifacts/windows-cuda12-bundle/*cuda12*.exe
