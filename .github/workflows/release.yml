name: release

# 正式版发布：推送 v* tag 触发，三平台打包并创建 GitHub Release（草稿，手动发布）
on:
  push:
    tags: ["v*"]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Tauri + ALSA audio + AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev patchelf libfuse2

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # ALSA 兜底音频（CI runner 的 PipeWire 头文件过老）；完整 PipeWire 版
      # 请在目标 Linux 机上 ./run-release.sh 自建
      - name: Build (Linux x64, AppImage + deb)
        run: pnpm tauri build -- --no-default-features

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build (Windows x64, NSIS 中文安装器, CPU 版)
        run: pnpm tauri build -- --no-default-features

      - uses: actions/upload-artifact@v4
        with:
          name: windows-cpu-bundle
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-windows-cuda:
    # 内置翻译引擎 GPU 推理版：需目标机装有 CUDA 13 运行时（驱动 ≥ 580）
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "13.2.0"
          method: "local"

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build (Windows x64, NSIS 安装器, CUDA GPU 版)
        run: pnpm tauri build -- --no-default-features --features cuda
        env:
          CUDA_COMPUTE_CAP: "86"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-cuda-bundle
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows, build-windows-cuda]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/linux-bundles/*.AppImage
            artifacts/linux-bundles/*.deb
            artifacts/windows-cpu-bundle/*.exe
            artifacts/windows-cuda-bundle/*.exe
